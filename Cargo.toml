[workspace]
resolver = "3"
members = [
    "crates/mu-protocol",
    "crates/mu-data",
    "crates/mu-client",
    "crates/mu-connect",
    "crates/mu-server",
    "crates/mu-launcher",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Crixpx-VE/mu-rs"

[workspace.dependencies]
mu-protocol = { path = "crates/mu-protocol" }
mu-data = { path = "crates/mu-data" }
# wav (sound effects) and mp3 (music) from the original client.
bevy = { version = "0.20.1", features = ["wav", "mp3"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Text widths with the UI font (chat).
ab_glyph = "0.2.32"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }

# Bevy in debug is very slow without optimizing dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
