[package]
name = "mu-client"
description = "Cliente de MU Online"
version.workspace = true
edition.workspace = true

[dependencies]
mu-data.workspace = true
mu-protocol.workspace = true
bevy.workspace = true
serde.workspace = true
serde_json.workspace = true
ab_glyph.workspace = true

[features]
# Para medir: `cargo build --release -p mu-client --features traza` escribe una traza de Chrome
# (`trace-*.json`) con lo que tarda cada sistema. No va en la versión que se publica.
traza = ["bevy/trace_chrome"]
